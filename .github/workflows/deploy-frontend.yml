name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options: [production]

permissions:
  id-token: write
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      API_BASE_URL: ${{ vars.API_GATEWAY_URL }}
      COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
      COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build production frontend
        working-directory: frontend
        env:
          VITE_APP_ENV: production
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
          VITE_COGNITO_DOMAIN: ${{ env.COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ env.COGNITO_CLIENT_ID }}
          VITE_COGNITO_REDIRECT_URI: ${{ env.FRONTEND_URL }}/auth/callback
          VITE_COGNITO_LOGOUT_URI: ${{ env.FRONTEND_URL }}
        run: npm run build

      - name: Upload static site
        working-directory: frontend
        run: aws s3 sync dist/ "s3://${FRONTEND_BUCKET}/" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

      - name: Smoke test
        run: curl --fail --silent --show-error "$FRONTEND_URL/" > /dev/null