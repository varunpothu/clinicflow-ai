name: Container Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build backend image
        run: docker build -f Dockerfile -t clinicflow-ai-backend:ci backend

      - name: Build frontend image
        run: docker build -f Dockerfile -t clinicflow-ai-frontend:ci frontend
