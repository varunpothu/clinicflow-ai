name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options: [production]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'clinicflow-ai' }}
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify identity
        run: aws sts get-caller-identity

      - name: Resolve deployment targets
        id: targets
        run: |
          echo "ecr=${PROJECT_NAME}-${ENVIRONMENT}-app" >> "$GITHUB_OUTPUT"
          echo "cluster=${PROJECT_NAME}-${ENVIRONMENT}-cluster" >> "$GITHUB_OUTPUT"
          echo "service=${PROJECT_NAME}-${ENVIRONMENT}-service" >> "$GITHUB_OUTPUT"

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ steps.targets.outputs.ecr }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:${GITHUB_SHA}"
          docker build -f backend/Dockerfile -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Read current task definition
        env:
          CLUSTER: ${{ steps.targets.outputs.cluster }}
          SERVICE: ${{ steps.targets.outputs.service }}
        run: |
          TASK_DEF=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)
          test "$TASK_DEF" != "None"
          aws ecs describe-task-definition --task-definition "$TASK_DEF" --query 'taskDefinition' > task-def.json

      - name: Render immutable task definition
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          jq --arg image "$IMAGE" 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) | .containerDefinitions[0].image=$image' task-def.json > task-def-rendered.json

      - name: Register task definition and run migrations
        id: release
        env:
          CLUSTER: ${{ steps.targets.outputs.cluster }}
          SERVICE: ${{ steps.targets.outputs.service }}
        run: |
          TASK_DEF=$(aws ecs register-task-definition --cli-input-json file://task-def-rendered.json --query 'taskDefinition.taskDefinitionArn' --output text)
          SUBNETS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets' --output json)
          SECURITY_GROUPS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].networkConfiguration.awsvpcConfiguration.securityGroups' --output json)
          jq -n --argjson subnets "$SUBNETS" --argjson groups "$SECURITY_GROUPS" '{awsvpcConfiguration:{subnets:$subnets,securityGroups:$groups,assignPublicIp:"DISABLED"}}' > network.json
          printf '%s\n' '{"containerOverrides":[{"name":"clinicflow-api","command":["alembic","upgrade","head"]}]}' > migration-overrides.json
          TASK_ARN=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TASK_DEF" --network-configuration file://network.json --overrides file://migration-overrides.json --query 'tasks[0].taskArn' --output text)
          test "$TASK_ARN" != "None"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[?name==`clinicflow-api`].exitCode | [0]' --output text)
          test "$EXIT_CODE" = "0"
          echo "task_definition=$TASK_DEF" >> "$GITHUB_OUTPUT"

      - name: Update service
        env:
          CLUSTER: ${{ steps.targets.outputs.cluster }}
          SERVICE: ${{ steps.targets.outputs.service }}
          TASK_DEF: ${{ steps.release.outputs.task_definition }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$TASK_DEF" --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Smoke test API
        env:
          API_BASE_URL: ${{ vars.API_GATEWAY_URL }}
        run: |
          test -n "$API_BASE_URL"
          curl --fail --silent --show-error "$API_BASE_URL/api/v1/health/live"
          echo
          echo "Deployment completed: ${{ steps.release.outputs.task_definition }}"