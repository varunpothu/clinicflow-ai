<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
<defs>
  <linearGradient id="g1" x1="0" x2="1"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="g2" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#10b981"/></linearGradient>
  <linearGradient id="g3" x1="0" x2="1"><stop stop-color="#ec4899"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#475569"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/></filter>
</defs>

<rect x="20" y="20" width="1460" height="780" rx="34" fill="#f8fafc"/>
<text x="75" y="75" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#0f172a">ClinicFlow AI • Appointment Orchestration</text>
<text x="75" y="114" font-family="Arial, sans-serif" font-size="20" fill="#475569">AI proposes → rules validate → human approves → system executes → everything important is auditable</text>

<g font-family="Arial, sans-serif" filter="url(#shadow)">
  <rect x="70" y="165" width="285" height="165" rx="26" fill="#dbeafe" stroke="#4f46e5" stroke-width="3"/>
  <circle cx="112" cy="207" r="25" fill="#4f46e5"/>
  <text x="104" y="216" font-size="22" font-weight="700" fill="#fff">1</text>
  <text x="150" y="211" font-size="21" font-weight="700" fill="#1e3a8a">Patient request</text>
  <text x="96" y="252" font-size="17" fill="#334155">Natural language or</text>
  <text x="96" y="278" font-size="17" fill="#334155">structured booking</text>

  <rect x="390" y="165" width="285" height="165" rx="26" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="432" cy="207" r="25" fill="#7c3aed"/>
  <text x="424" y="216" font-size="22" font-weight="700" fill="#fff">2</text>
  <text x="470" y="211" font-size="21" font-weight="700" fill="#5b21b6">AI gateway</text>
  <text x="416" y="252" font-size="17" fill="#334155">Intent extraction</text>
  <text x="416" y="278" font-size="17" fill="#334155">strict JSON schema</text>

  <rect x="710" y="165" width="300" height="165" rx="26" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
  <circle cx="752" cy="207" r="25" fill="#0f766e"/>
  <text x="744" y="216" font-size="22" font-weight="700" fill="#fff">3</text>
  <text x="790" y="207" font-size="19" font-weight="700" fill="#115e59">Deterministic</text>
  <text x="790" y="231" font-size="19" font-weight="700" fill="#115e59">rules</text>
  <text x="735" y="267" font-size="17" fill="#334155">Validation + availability</text>
  <text x="735" y="293" font-size="17" fill="#334155">no model write access</text>

  <rect x="1045" y="165" width="375" height="165" rx="26" fill="#ffedd5" stroke="#f97316" stroke-width="3"/>
  <circle cx="1087" cy="207" r="25" fill="#f97316"/>
  <text x="1079" y="216" font-size="22" font-weight="700" fill="#fff">4</text>
  <text x="1125" y="211" font-size="21" font-weight="700" fill="#9a3412">Human approval</text>
  <text x="1070" y="252" font-size="17" fill="#334155">Approve • reject • modify</text>
  <text x="1070" y="278" font-size="17" fill="#334155">proposal version checked</text>

  <path d="M355 248 L390 248" stroke="#475569" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
  <path d="M675 248 L710 248" stroke="#475569" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
  <path d="M1010 248 L1045 248" stroke="#475569" stroke-width="5" marker-end="url(#arrow)" fill="none"/>

  <rect x="115" y="405" width="345" height="185" rx="28" fill="url(#g1)"/>
  <circle cx="165" cy="450" r="23" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="156" y="459" font-size="21" font-weight="700" fill="#fff">5</text>
  <text x="205" y="458" font-size="22" font-weight="700" fill="#fff">Final revalidation</text>
  <text x="150" y="500" font-size="17" fill="#fff">Check slot immediately</text>
  <text x="150" y="526" font-size="17" fill="#fff">before the booking write.</text>
  <text x="150" y="565" font-size="17" fill="#e0e7ff">Protects against stale approval</text>

  <rect x="578" y="405" width="345" height="185" rx="28" fill="url(#g2)"/>
  <circle cx="628" cy="450" r="23" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="619" y="459" font-size="21" font-weight="700" fill="#fff">6</text>
  <text x="668" y="458" font-size="22" font-weight="700" fill="#fff">Transaction</text>
  <text x="613" y="500" font-size="17" fill="#fff">Create appointment and</text>
  <text x="613" y="526" font-size="17" fill="#fff">audit/outbox event together.</text>
  <text x="613" y="565" font-size="17" fill="#ecfeff">Idempotent side effects</text>

  <rect x="1040" y="405" width="345" height="185" rx="28" fill="url(#g3)"/>
  <circle cx="1090" cy="450" r="23" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="1081" y="459" font-size="21" font-weight="700" fill="#fff">7</text>
  <text x="1130" y="458" font-size="22" font-weight="700" fill="#fff">Async operations</text>
  <text x="1075" y="500" font-size="17" fill="#fff">Notifications • analytics</text>
  <text x="1075" y="526" font-size="17" fill="#fff">retries • DLQ • events</text>
  <text x="1075" y="565" font-size="17" fill="#f3e8ff">Observable and replayable</text>

  <path d="M1232 330 C1232 365 1215 375 1215 405" stroke="#475569" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
  <path d="M1040 525 L923 525" stroke="#475569" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
  <path d="M578 525 L460 525" stroke="#475569" stroke-width="5" marker-end="url(#arrow)" fill="none"/>

  <rect x="85" y="650" width="1330" height="82" rx="20" fill="#0f172a"/>
  <text x="120" y="700" font-size="20" font-weight="700" fill="#fff">Safety boundary</text>
  <text x="315" y="700" font-size="18" fill="#cbd5e1">AI can interpret and propose; only deterministic services and authorised humans can cause controlled booking side effects.</text>
</g>
</svg>