<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><linearGradient id="a" x1="0" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><linearGradient id="b" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient><linearGradient id="c" x1="0" x2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#ef4444"/></linearGradient><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><rect width="1400" height="560" rx="30" fill="#f8fafc"/><text x="60" y="65" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">FDE Delivery Lifecycle</text><text x="60" y="98" font-family="Arial" font-size="18" fill="#475569">From customer problem discovery to production operations and measurable outcomes</text><g font-family="Arial"><rect x="60" y="170" width="230" height="210" rx="25" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="90" y="215" font-size="24" font-weight="700" fill="#1e3a8a">1 • Discover</text><text x="90" y="255" font-size="17" fill="#334155">Customer workflow</text><text x="90" y="282" font-size="17" fill="#334155">Pain points</text><text x="90" y="309" font-size="17" fill="#334155">Success metrics</text><text x="90" y="336" font-size="17" fill="#334155">Constraints</text><rect x="330" y="170" width="230" height="210" rx="25" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="360" y="215" font-size="24" font-weight="700" fill="#5b21b6">2 • Design</text><text x="360" y="255" font-size="17" fill="#334155">Architecture</text><text x="360" y="282" font-size="17" fill="#334155">Integration contracts</text><text x="360" y="309" font-size="17" fill="#334155">Security boundaries</text><text x="360" y="336" font-size="17" fill="#334155">Failure modes</text><rect x="600" y="170" width="230" height="210" rx="25" fill="#ccfbf1" stroke="#0