<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><rect width="1400" height="650" rx="30" fill="#f8fafc"/><text x="60" y="65" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Appointment Workflow State Machine</text><text x="60" y="98" font-family="Arial" font-size="18" fill="#475569">Explicit states make retries, approvals, conflicts and recovery observable</text><g font-family="Arial" font-size="17" text-anchor="middle"><rect x="70" y="150" width="190" height="80" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="165" y="183" font-weight="700" fill="#1e3a8a">RECEIVED</text><text x="165" y="208" fill="#334155">request accepted</text><rect x="310" y="150" width="190" height="80" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="405" y="183" font-weight="700" fill="#5b21b6">EXTRACTING</text><text x="405" y="208" fill="#334155">AI interpretation</text><rect x="550" y="150" width="190" height="80" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/><text x="645" y="183" font-weight="700" fill="#115e59">VALIDATING</text><text x="645" y="208" fill="#334155">rules + schema</text><rect x="790" y="150" width="190" height="80" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="885" y="183" font-weight="700" fill="#075985">FINDING_SLOTS</text><text x="885" y="208" fill="#334155">availability</text><rect x="1030" y="150" width="260" height="80" rx="18" fill="#ffedd5" stroke="#f97316" stroke-width="3"/><text x="1160" y="183" font-weight="700" fill="#9a3412">WAITING_FOR_APPROVAL</text><text x="1160" y="208" fill="#334155">human decision</text><path d="M260 190h50M500 190h50M740 190h50M980 190h50" stroke="#64748b" stroke-width="5" marker-end="url(#x)"/><rect x="250" y="340" width="200" height="85" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="350" y="375" font-weight="700" fill="#166534">APPROVED</text><text x="350" y="401" fill="#334155">revalidate</text><rect x="520" y="340" width="200" height="85" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="620" y="375" font-weight="700" fill="#1e3a8a">BOOKING</text><text x="620" y="401" fill="#334155">transaction</text><rect x="790" y="340" width="200" height="85" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="890" y="375" font-weight="700" fill="#166534">CONFIRMED</text><text x="890" y="401" fill="#334155">notify + audit</text><rect x="1060" y="340" width="200" height="85" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><text x="1160" y="375" font-weight="700" fill="#991b1b">CONFLICT</text><text x="1160" y="401" fill="#334155">regenerate</text><path d="M1160 230v70M450 382h70M720 382h70M990 382h70" stroke="#64748b" stroke-width="5" marker-end="url(#x)"/><path d="M1160 425 C1160 500 890 530 890 425" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="9 8"/><text x="890" y="555" font-size="18" fill="#475569">Terminal outcomes are explicit; transient failures retry, business conflicts return to proposal generation.</text></g><defs><marker id="x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs></svg>